<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fullscreen PoC</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* IFRAME */
    #video-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #000;
    }

    #ytplayer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /*
     * Page shown immediately after fullscreen
     */
    #error-screen {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      z-index: 20;

      background: #fff;
      text-align: center;

      padding: 20px;
      box-sizing: border-box;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      /* very short transition */
      transition: opacity 0.08s linear;
    }

    #error-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .poc-icon {
      width: 120px;
      height: 120px;

      border-radius: 20px;
      background: #eeeeee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 60px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;

      margin: 0 0 14px;

      color: #030303;
    }

    .error-msg {
      font-size: 18px;
      color: #606060;

      margin: 0 0 12px;

      max-width: 520px;

      line-height: 1.5;
    }

    .security-note {
      font-size: 16px;
      color: #c00;

      font-weight: 500;

      margin: 8px 0 22px;
    }

    /* FEEDBACK BOX */

    .feedback-box {
      width: min(500px, 90%);
      margin-bottom: 22px;
      text-align: left;
    }

    .feedback-box label {
      display: block;

      font-size: 14px;
      color: #606060;

      margin-bottom: 8px;
    }

    .feedback-box textarea {
      width: 100%;
      min-height: 110px;

      box-sizing: border-box;

      padding: 12px;

      border: 1px solid #ccc;
      border-radius: 4px;

      outline: none;

      font-family: Arial, sans-serif;
      font-size: 14px;

      resize: vertical;
    }

    .feedback-box textarea:focus {
      border-color: #065fd4;
      box-shadow: 0 0 0 1px #065fd4;
    }

    .btn-retry {
      background: #065fd4;

      color: white;

      border: none;

      padding: 12px 32px;

      font-size: 14px;
      font-weight: 500;

      border-radius: 2px;

      cursor: pointer;

      text-transform: uppercase;
    }

    .btn-retry:hover {
      background: #054bb5;
    }

    .small-note {
      position: absolute;

      bottom: 24px;

      font-size: 12px;

      color: #909090;
    }

    @media (max-width: 500px) {

      .poc-icon {
        width: 100px;
        height: 100px;
        font-size: 50px;
      }

      h1 {
        font-size: 24px;
      }

      .error-msg,
      .security-note {
        font-size: 16px;
      }

    }
  </style>
</head>

<body>

<div id="container">

  <!-- ORIGINAL PAGE -->
  <div id="video-wrapper">

    <iframe
      id="ytplayer"
      src="https://helpful-faun-a7653e.netlify.app/cho.html"
      title="Fullscreen PoC"
      frameborder="0"
      allow="fullscreen"
      allowfullscreen>
    </iframe>

  </div>


  <!-- PAGE APPEARS AFTER FULLSCREEN -->
  <div id="error-screen">

    <div class="poc-icon">
      ⛶
    </div>

    <h1>
      Fullscreen PoC
    </h1>

    <p class="error-msg">
      The embedded page has entered fullscreen mode.
    </p>

    <p class="security-note">
      Fullscreen transition detected successfully.
    </p>


    <!-- FEEDBACK -->
    <div class="feedback-box">

      <label for="feedback">
        Feedback
      </label>

      <textarea
        id="feedback"
        placeholder="Type your feedback here..."></textarea>

    </div>


    <button
      class="btn-retry"
      onclick="location.reload()">

      RETRY

    </button>


    <div class="small-note">
      Browser fullscreen behavior test
    </div>

  </div>

</div>


<script>

  const videoWrapper =
    document.getElementById("video-wrapper");

  const errorScreen =
    document.getElementById("error-screen");

  let activated = false;


  /*
   * Show the second page immediately.
   */
  function activateError() {

    if (activated)
      return;

    activated = true;

    /*
     * No 600ms delay.
     * No waiting for animation.
     */
    videoWrapper.style.display = "none";

    errorScreen.classList.add("active");

  }


  /*
   * Hide second page when fullscreen exits.
   */
  function deactivateError() {

    activated = false;

    errorScreen.classList.remove("active");

    videoWrapper.style.display = "block";

  }


  /*
   * Standard Fullscreen API
   */
  document.addEventListener(
    "fullscreenchange",
    function () {

      const fullscreen =
        document.fullscreenElement;

      console.log(
        "Fullscreen:",
        fullscreen
      );

      if (fullscreen) {

        /*
         * Fullscreen detected →
         * immediately show page.
         */
        activateError();

      } else {

        deactivateError();

      }

    },
    true
  );


  /*
   * WebKit
   */
  document.addEventListener(
    "webkitfullscreenchange",
    function () {

      if (
        document.webkitFullscreenElement
      ) {

        activateError();

      } else {

        deactivateError();

      }

    },
    true
  );


  /*
   * Firefox
   */
  document.addEventListener(
    "mozfullscreenchange",
    function () {

      if (
        document.mozFullScreenElement
      ) {

        activateError();

      } else {

        deactivateError();

      }

    },
    true
  );


  /*
   * MS
   */
  document.addEventListener(
    "MSFullscreenChange",
    function () {

      if (
        document.msFullscreenElement
      ) {

        activateError();

      } else {

        deactivateError();

      }

    },
    true
  );


  iframe.addEventListener(
    "load",
    function () {

      console.log(
        "Iframe loaded:",
        iframe.src
      );

    }
  );

</script>

</body>
</html>
