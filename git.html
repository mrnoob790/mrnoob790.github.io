<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen + Keyboard + Assistant PoC</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #121212;
    color: #ffffff;
    font-family: sans-serif;
    overflow: hidden; /* Prevent scrolling when input is focused */
  }
  
  #click-target {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 10;
  }

  /* Input field jisse keyboard open hoga - visible but transparent */
  #keyboard-trigger {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.01; /* 0 karne pe kuch browsers focus ignore kar dete hain */
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>

  <div id="click-target">
    Tap here to trigger Fullscreen, Keyboard & Gemini
  </div>

  <input type="text" id="keyboard-trigger" autocomplete="off">

<script>
  const clickTarget = document.getElementById('click-target');
  const keyboardTrigger = document.getElementById('keyboard-trigger');

  // Mobile ke liye click ya touchend best rehta hai
  clickTarget.addEventListener('click', (e) => {
    
    // 1. Keyboard trigger karna (Input par focus laana)
    keyboardTrigger.focus();

    // 2. Fullscreen mode trigger karna
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.error("Fullscreen error:", err);
      });
    }

    // 3. Intent trigger karna
    // Delay thoda zyada rakha hai taki keyboard animation aur fullscreen set ho jaye
    setTimeout(() => {
      const assistantIntent = "intent:#Intent;action=android.intent.action.ASSIST;end";
      window.location.href = assistantIntent;
    }, 400); 

  });
</script>
</body>
</html>
