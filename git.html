<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simultaneous Keyboard & Intent PoC</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1a1a1a;
    color: #00ffcc;
    font-family: monospace;
    overflow: hidden;
  }
  
  #trigger-box {
    width: 80vw;
    height: 30vh;
    border: 2px dashed #00ffcc;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.2rem;
    text-align: center;
  }

  /* Keyboard trigger - invisible but focusable */
  #ghost-input {
    position: absolute;
    top: -1000px; /* Viewport ke bahar rakha hai */
    opacity: 0.01;
  }
</style>
</head>
<body>

  <div id="trigger-box">
    TAP TO EXECUTE
  </div>

  <input type="text" id="ghost-input" autocomplete="off">

<script>
  const triggerBox = document.getElementById('trigger-box');
  const ghostInput = document.getElementById('ghost-input');

  triggerBox.addEventListener('touchend', (e) => {
    // Default scroll/click behavior ko rokenge
    e.preventDefault(); 

    // 1. Keyboard Focus (Synchronous)
    ghostInput.focus();

    // 2. Fullscreen Request (Asynchronous promise, but initiated synchronously)
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.error("Fullscreen error:", err);
      });
    }

    // 3. Intent Execution (Synchronous navigation command)
    const assistantIntent = "intent:#Intent;action=android.intent.action.ASSIST;end";
    
    // Iframe ke through intent trigger karna (Main page state ko zinda rakhne ke liye ek trick)
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = assistantIntent;
    document.body.appendChild(iframe);

    // Agar iframe intent block ho jaye, toh immediate fallback
    window.location.href = assistantIntent;

  });
</script>
</body>
</html>
