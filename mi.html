<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;height:100vh;background:#f1f1f1;font-family:Roboto,Arial,sans-serif;color:#030303;display:flex;align-items:center;justify-content:center;overflow:hidden}
#container{position:relative;width:100%;height:100%}
#video-wrapper{position:absolute;inset:0;transition:opacity .6s ease;z-index:1}
#video-wrapper iframe{display:block;border:0}
#error-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:10;background:#fff;text-align:center;padding:20px;box-sizing:border-box}
#error-screen.active{opacity:1;pointer-events:auto}
.youtube-error-logo{width:180px;height:180px;margin-bottom:32px;background:url('https://s3.amazonaws.com/images.seroundtable.com/youtube-404-1409831247.png') no-repeat center/contain}
h1{font-size:28px;font-weight:400;margin:0 0 16px;color:#030303}
.error-msg{font-size:18px;color:#606060;margin:0 0 12px;max-width:520px;line-height:1.5}
.security-note{font-size:16px;color:#c00;font-weight:500;margin:24px 0 40px;max-width:500px}
.btn-retry{background:#065fd4;color:white;border:0;padding:12px 32px;font-size:14px;font-weight:500;border-radius:2px;cursor:pointer;text-transform:uppercase;transition:background .2s}
.btn-retry:hover{background:#054bb5}
.small-note{position:absolute;bottom:24px;font-size:12px;color:#909090}
@media(max-width:500px){.youtube-error-logo{width:140px;height:140px;margin-bottom:24px}h1{font-size:24px}.error-msg,.security-note{font-size:16px}}
</style>
</head>
<body>
<div id="container">
  <div id="video-wrapper">
    <iframe id="ytplayer" width="100%" height="100%" src="https://1drv.ms/p/c/8b25753dba53adea/IQTe48clv8NCT6gExh1KdAbAAeuZejxhQC0uOw1pxdNR5KM?wdAr=1.7777777777777777" title="PowerPoint Viewer" allow="fullscreen" allowfullscreen></iframe>
  </div>
  <div id="error-screen">
    <div class="youtube-error-logo"></div>
    <h1>We're sorry...</h1>
    <p class="error-msg">An error occurred. Please try again later.<br>(Playback ID: spoof-ERROR-abc123xyz)</p>
    <p class="security-note">There is a security issue on YouTube right now.<br>For continued access, please visit <strong>fake-youtube.com</strong></p>
    <button class="btn-retry" onclick="location.reload()">RETRY</button>
    <div class="small-note">This is a spoof / parody — no real error or security issue exists</div>
  </div>
</div>
<script>
const videoWrapper=document.getElementById('video-wrapper');
const errorScreen=document.getElementById('error-screen');
function isInRealFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement)}
function activateError(){videoWrapper.style.opacity='0';setTimeout(()=>{videoWrapper.style.display='none';errorScreen.classList.add('active')},600)}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(name=>document.addEventListener(name,()=>{if(isInRealFullscreen())activateError()}));
const iframe=document.getElementById('ytplayer');
iframe.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement===iframe)console.log('PowerPoint viewer fullscreen — spoof skipped')});
</script>
</body>
</html>
