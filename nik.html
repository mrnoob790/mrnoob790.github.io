<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen Test</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial, sans-serif;
    cursor:pointer;
}

#fullscreenElement{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#111;
}

#title{
    font-size:32px;
    line-height:1.6;
}

#title span{
    font-size:22px;
    color:#ffd54f;
}

#fullscreenMessage{
    display:none;
    font-size:60px;
    font-weight:bold;
    color:#fff;
}
</style>
</head>

<body onclick="main()">

<div id="fullscreenElement">

    <div>
        <div id="title">
            Click Anywhere to Enter Fullscreen
            <br><br>

            <span>
                After the screen changes, rapidly double-click anywhere.
            </span>
        </div>

        <div id="fullscreenMessage">
            How are you?
        </div>
    </div>

    <div id="pointerLockElement"></div>

</div>

<script>

const fullscreenElement =
    document.getElementById("fullscreenElement");

const pointerLockElement =
    document.getElementById("pointerLockElement");


function main() {

    /*
    Original Pointer Lock
    */
    pointerLockElement.requestPointerLock();

    fullscreenElement.appendChild(
        pointerLockElement
    );

    fullscreenElement.requestFullscreen();

}


document.addEventListener(
    "fullscreenchange",
    function () {

        if (document.fullscreenElement) {

            document.getElementById(
                "title"
            ).style.display = "none";

            document.getElementById(
                "fullscreenMessage"
            ).style.display = "block";


            /*
            Fullscreen hone ke 600ms baad
            automatically page par synthetic click event
            */
            setTimeout(() => {

                if (
                    document.fullscreenElement
                ) {

                    const event =
                        new MouseEvent("click", {
                            bubbles: true,
                            cancelable: true,
                            view: window,

                            clientX:
                                window.innerWidth / 2,

                            clientY:
                                window.innerHeight / 2
                        });

                    fullscreenElement.dispatchEvent(
                        event
                    );

                }

            }, 600);


        } else {

            document.getElementById(
                "title"
            ).style.display = "block";

            document.getElementById(
                "fullscreenMessage"
            ).style.display = "none";

        }

    }
);

</script>

</body>
</html>
