<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Permission Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    button {
      border: 0;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Notification Test</h2>

    <p>
      Click the button below to request notification permission.
    </p>

    <button id="notify">
      Enable Notifications
    </button>

    <div id="status">
      Current permission:
      <b id="permission">Checking...</b>
    </div>
  </div>

<script>
const permissionEl = document.getElementById("permission");
const statusEl = document.getElementById("status");
const button = document.getElementById("notify");

function updatePermission() {
  if (!("Notification" in window)) {
    permissionEl.textContent = "Notifications not supported";
    button.disabled = true;
    return;
  }

  permissionEl.textContent = Notification.permission;
}

button.addEventListener("click", async () => {
  if (!("Notification" in window)) {
    statusEl.textContent = "This browser does not support notifications.";
    return;
  }

  try {
    const permission = await Notification.requestPermission();

    permissionEl.textContent = permission;

    if (permission === "granted") {
      statusEl.textContent =
        "Permission granted. Sending test notification...";

      new Notification("Notification Test", {
        body: "Notification permission was successfully granted."
      });

    } else if (permission === "denied") {
      statusEl.textContent =
        "Notification permission was denied.";

    } else {
      statusEl.textContent =
        "Notification permission was dismissed.";
    }

  } catch (e) {
    statusEl.textContent = "Error: " + e;
  }
});

updatePermission();
</script>

</body>
</html>
