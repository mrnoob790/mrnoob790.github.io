<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen + Pointer Lock Test</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f4f4f9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
    cursor:default;
}

#status {
    text-align:center;
    font-size:34px;
    line-height:1.6;
}

/* Login Panel Styling */
#login-panel {
    display: none; /* Starting mein hide rahega */
    background: #fff;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
}

#login-panel h2 {
    margin-top: 0;
    margin-bottom: 20px;
    color: #333;
}

#login-panel input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 16px;
}

#login-panel button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

#login-panel button:hover {
    background-color: #0056b3;
}
</style>
</head>

<body>

<!-- Initial Status Text -->
<div id="status">
    Click Anywhere to Enter Fullscreen
</div>

<!-- Login Panel (Hidden initially) -->
<div id="login-panel">
    <h2>Login Portal</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
</div>

<script>

const status = document.getElementById("status");
const loginPanel = document.getElementById("login-panel");

let started = false;
let pointerRequested = false;

document.addEventListener("click", async (e) => {
    
    // Agar login panel ke andar click kiya hai toh fullscreen trigger mat karo
    if (loginPanel.contains(e.target)) return;

    // First click enters fullscreen
    if (!started) {
        started = true;
        try {
            status.innerHTML = "Fullscreen Active<br><br>Waiting for Pointer Lock...";
            // Sirf fullscreen request karenge yahan
            await document.documentElement.requestFullscreen();
        } catch (err) {
            console.log(err);
            started = false;
        }
        return;
    }

    // Retry if previous request failed
    if (document.fullscreenElement && !document.pointerLockElement && !pointerRequested) {
        pointerRequested = true;
        document.body.requestPointerLock();
    }

});

document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement) {
        // Aap chahein toh status update kar sakte hain, par ab login panel dikh raha hai
        console.log("✅ Pointer Locked");
        
        setTimeout(() => {
            document.exitPointerLock();
            console.log("🔓 Pointer Unlocked Automatically");
        }, 1000);
    } else {
        if (document.fullscreenElement) {
            pointerRequested = false;
        }
    }
});

document.addEventListener("fullscreenchange", () => {
    
    // Check if we entered fullscreen mode
    if (document.fullscreenElement) {
        
        // Fullscreen active hone ke baad Status hide karo aur Login Panel dikhao
        status.style.display = "none";
        loginPanel.style.display = "block";
        
        // Fullscreen puri tarah active hone ke baad pointer lock request karo
        if (!document.pointerLockElement && !pointerRequested) {
            pointerRequested = true;
            
            // 600ms ka delay kar diya gaya hai yahan
            setTimeout(() => {
                document.body.requestPointerLock();
            }, 600);
        }
        
    } else {
        
        // Fullscreen se exit hone par variables reset karo aur wapas Status text dikhao
        started = false;
        pointerRequested = false;
        
        loginPanel.style.display = "none";
        status.style.display = "block";
        status.innerHTML = "Click Anywhere to Enter Fullscreen";
        
    }

});

</script>

</body>
</html>
