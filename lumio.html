<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f9ff, #eef2ff);
    }

    .open-btn {
      border: 0;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: #222;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }

    .open-btn:active {
      transform: scale(.97);
    }
  </style>
</head>

<body>

  <button class="open-btn" onclick="go()">
    Click here
  </button>

  <script>
    function go() {
      var x = window.open(
        'javascript:verylongurl.googlecloudplatform.accounts.google.com'
      );

      setTimeout(function() {
        x.document.write(`
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,
                       initial-scale=1.0,
                       maximum-scale=1.0"
            >

            <style>
              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                padding: 0;
                width: 100%;
                min-height: 100%;
              }

              body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 18px;

                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Arial,
                  sans-serif;

                background:
                  radial-gradient(
                    circle at top left,
                    #ffffff 0%,
                    #f4f6ff 45%,
                    #e9edff 100%
                  );
              }

              .card {
                width: 100%;
                max-width: 430px;

                padding: 30px 22px 24px;

                background: rgba(255,255,255,.92);
                border: 1px solid rgba(255,255,255,.8);
                border-radius: 24px;

                text-align: center;

                box-shadow:
                  0 15px 45px rgba(50,60,100,.12),
                  0 3px 10px rgba(50,60,100,.06);

                backdrop-filter: blur(10px);
              }

              .icon {
                width: 62px;
                height: 62px;
                margin: 0 auto 18px;

                display: flex;
                align-items: center;
                justify-content: center;

                border-radius: 18px;

                background: #f0f2ff;

                font-size: 30px;
              }

              .title {
                font-size: clamp(22px, 6vw, 30px);
                line-height: 1.25;
                font-weight: 700;
                color: #202124;

                overflow-wrap: anywhere;
              }

              .message {
                margin-top: 14px;

                font-size: clamp(17px, 4.5vw, 21px);
                line-height: 1.55;

                color: #5f6368;

                overflow-wrap: anywhere;
              }

              .image {
                display: block;

                width: 100%;
                max-width: 100%;
                height: auto;

                margin: 22px auto 0;

                border-radius: 16px;

                box-shadow:
                  0 6px 20px rgba(0,0,0,.08);
              }

              .note {
                margin-top: 18px;

                font-size: 13px;
                line-height: 1.4;

                color: #8a8f98;
              }

              @media (max-width: 360px) {
                body {
                  padding: 12px;
                }

                .card {
                  padding: 24px 16px 20px;
                  border-radius: 20px;
                }

                .icon {
                  width: 54px;
                  height: 54px;
                  font-size: 26px;
                }
              }
            </style>
          </head>

          <body>

            <div class="card">

              <div class="icon">✨</div>

              <div class="title">
                Demo Page
              </div>

              <div class="message">
                For the demo, visit
                <br>
                wwww.fake-gmail.com
              </div>

              <img
                class="image"
                src="a.jpg"
                alt="Demo image"
              >

              <div class="note">
                Mobile-friendly demonstration page
              </div>

            </div>

          </body>
          </html>
        `);

        x.document.close();
      }, 100);
    }
  </script>

</body>
</html>
